<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No remote anything: this page is part of the app shell. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:;">
<title>Gamma</title>
<style>
  /* The web UI's palette, so the first screen doesn't look like a different
     program than the one behind it. */
  :root {
    --bg-page: #111;
    --bg-surface: #1a1a1a;
    --bg-card: #1d1d1d;
    --bg-input: #222;
    --bg-hover: #333;
    --text-primary: #eee;
    --text-muted: #888;
    --text-dim: #666;
    --border: #333;
    --border-hover: #555;
    --accent: #5b9bd5;
    --accent-bg: rgba(42, 79, 122, 0.3);
    --danger: #e05c5c;
    --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    /* The window is frameless-ish on macOS; leave room for the traffic lights. */
    padding: 40px 32px 32px;
    -webkit-user-select: none; user-select: none;
  }
  main { width: 100%; max-width: 520px; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .mark { flex: none; width: 44px; height: 44px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); margin: 0; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .option:hover { border-color: var(--border-hover); }
  .option[aria-selected="true"] {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .option .dot {
    flex: none; width: 16px; height: 16px; margin-top: 2px;
    border: 1px solid var(--border-hover); border-radius: 50%;
    position: relative;
  }
  .option[aria-selected="true"] .dot { border-color: var(--accent); }
  .option[aria-selected="true"] .dot::after {
    content: ""; position: absolute; inset: 3px;
    background: var(--accent); border-radius: 50%;
  }
  .option h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .option p { margin: 0; color: var(--text-muted); font-size: 13px; }

  .server { margin: 12px 0 0; display: none; }
  .server.shown { display: block; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 9px 11px;
    background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 7px;
    font: inherit;
    -webkit-user-select: text; user-select: text;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  datalist { color: inherit; }

  .actions {
    margin-top: 22px; display: flex; align-items: center; gap: 12px;
    justify-content: flex-end;
  }
  .status { flex: 1; font-size: 13px; color: var(--text-muted); min-height: 20px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }
  button {
    padding: 9px 18px; border-radius: 7px; font: inherit; font-weight: 500;
    border: 1px solid var(--accent); background: var(--accent); color: #10202f;
    cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost {
    background: transparent; color: var(--text-muted); border-color: var(--border);
  }
  .foot { margin-top: 18px; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <!-- The mark, inlined: the page's CSP allows no external anything, and an
         inline <svg> is markup rather than a fetch. Same artwork as
         assets/icon.svg. -->
    <svg class="mark" viewBox="12 12 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="50" cy="40" r="22" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#e8a020" stop-opacity="0.3"/>
          <stop offset="60%" stop-color="#e8a020" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="c"><rect x="12" y="12" width="48" height="48" rx="11"/></clipPath>
      </defs>
      <rect x="12" y="12" width="48" height="48" rx="11" fill="#1e1e1c"/>
      <rect x="12" y="12" width="48" height="48" rx="11" fill="url(#g)"/>
      <g clip-path="url(#c)">
        <path d="M 16 36 C 22 27 30 27 36 36 C 42 45 50 45 56 36" stroke="#e8a020" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
        <path d="M 16 36 C 22 45 30 45 36 36 C 42 27 50 27 56 36" stroke="#e8a020" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
        <path d="M 16 13 Q 9 36 16 59" stroke="#e8a020" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.88"/>
        <path d="M 56 13 Q 63 36 56 59" stroke="#e8a020" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.88"/>
        <rect x="21" y="20" width="26" height="5" rx="1.2" fill="#eeebe4"/>
        <rect x="21" y="20" width="5" height="28" rx="1.2" fill="#eeebe4"/>
      </g>
    </svg>
    <div>
      <h1>Gamma</h1>
      <p class="sub">Where should your library live?</p>
    </div>
  </div>

  <div class="options" role="listbox" aria-label="How to run Gamma">
    <div class="option" id="opt-local" role="option" tabindex="0" aria-selected="true">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <h2>Run locally</h2>
        <p>Everything on this computer. Your PDFs and notes never leave it.
           No account, no network needed.</p>
      </div>
    </div>

    <div class="option" id="opt-remote" role="option" tabindex="0" aria-selected="false">
      <span class="dot" aria-hidden="true"></span>
      <div style="flex: 1">
        <h2>Connect to a server</h2>
        <p>Use a Gamma you already run somewhere else, and sign in as usual.</p>
        <div class="server" id="server-row">
          <label for="server">Server address</label>
          <input type="text" id="server" list="recent" spellcheck="false"
                 autocomplete="off" placeholder="https://gamma.example.com">
          <datalist id="recent"></datalist>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <span class="status" id="status" role="status"></span>
    <button class="ghost" id="cancel" hidden>Cancel</button>
    <button id="go">Continue</button>
  </div>
  <p class="foot">You can change this later from the File menu.</p>
</main>
<script src="chooser.js"></script>
</body>
</html>
