<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Gamma PDF: find your papers, follow your ideas</title>
  <desc id="desc">Download a paper and Gamma automatically fills its title, authors, journal and year. Organize papers with hierarchical folders and cross-cutting labels, and search titles, notes and full PDF text. While reading, follow a reference to another paper, then use Back to return to your previous reading position.</desc>
  <defs>
    <radialGradient id="markGlow" cx="24" cy="18" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a020" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="markClip"><rect width="48" height="48" rx="11"/></clipPath>
    <g id="gammaMark">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#1e1e1c"/>
    <rect x="0" y="0" width="48" height="48" rx="11" fill="url(#markGlow)"/>
    <g clip-path="url(#markClip)">
      <path d="M 4 24 C 10 15 18 15 24 24 C 30 33 38 33 44 24" stroke="#e8a020" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 4 24 C 10 33 18 33 24 24 C 30 15 38 15 44 24" stroke="#e8a020" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 4 1 Q -3 24 4 47" stroke="#e8a020" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.88"/>
      <path d="M 44 1 Q 51 24 44 47" stroke="#e8a020" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.88"/>
      <rect x="9" y="8" width="26" height="5" rx="1.2" fill="#eeebe4"/>
      <rect x="9" y="8" width="5" height="28" rx="1.2" fill="#eeebe4"/>
    </g>
    </g>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 8 5 2 8" fill="none" stroke="#e8b451" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="folder" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M1 7 V3 H12 L17 7 H29 V25 H1 Z"/>
    </g>
    <g id="page" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M2 1 H15 L22 8 V29 H2 Z M15 1 V8 H22 M7 15 H17 M7 21 H17"/>
    </g>
    <g id="search" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
      <circle cx="11" cy="11" r="8"/><path d="M17 17 25 25"/>
    </g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 9 7 14 18 3"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#1b1b1a"/>
  <g fill="none" stroke="#e8a020" stroke-width="3" opacity="0.22">
    <path d="M-60 920 C200 1160 510 1070 810 1000 S1400 920 1980 1080"/>
    <path d="M-60 985 C240 1210 590 1110 920 1055 S1530 1010 1980 1150"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <use href="#gammaMark" transform="translate(100 92) scale(1.2)"/>
    <text x="178" y="138" font-size="44" font-weight="700" letter-spacing="-1" fill="#f0ede6">Gamma<tspan dx="11" font-weight="400" fill="#e8a020">PDF</tspan></text>
    <text x="100" y="255" font-size="76" font-weight="600" letter-spacing="-2" fill="#f0ede6">Find your papers. Follow your ideas.</text>
    <text x="103" y="313" font-size="29" fill="#a9a69e">From the first download to the next connection — without losing your place.</text>

    <!-- Three stages, connected in reading order. -->
    <g font-size="25" font-weight="600" fill="#f0ede6">
      <text x="102" y="396"><tspan fill="#e8b451">01</tspan><tspan dx="16">Bring a paper in</tspan></text>
      <text x="602" y="396"><tspan fill="#e8b451">02</tspan><tspan dx="16">Make it easy to find</tspan></text>
      <text x="1212" y="396"><tspan fill="#e8b451">03</tspan><tspan dx="16">Keep the ideas connected</tspan></text>
    </g>
    <g fill="none" stroke="#e8b451" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M553 690 H587"/><path d="M1163 690 H1197"/>
    </g>

    <!-- Download: the title and bibliographic fields arrive with the paper. -->
    <rect x="100" y="428" width="450" height="520" rx="20" fill="#272725" stroke="#45443f" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="126" y="455" width="398" height="54" rx="10" fill="#32312e"/>
    <path d="M150 472 V490 M144 484 150 490 156 484 M140 496 H160" fill="none" stroke="#e8b451" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="174" y="489" font-size="21" fill="#a9a69e">Paste an arXiv / DOI link</text>
    <circle cx="148" cy="548" r="17" fill="#253e32"/>
    <use href="#check" x="138" y="540" color="#6fc89f"/>
    <text x="177" y="556" font-size="23" font-weight="600" fill="#f0ede6">Paper downloaded</text>
    <path d="M126 585 H524" stroke="#45443f"/>
    <text x="128" y="616" font-size="17" font-weight="600" letter-spacing="1.8" fill="#a9a69e">TITLE</text>
    <text x="128" y="650" font-size="23" font-weight="600" fill="#f0ede6">A quantum processor based on</text>
    <text x="128" y="679" font-size="23" font-weight="600" fill="#f0ede6">coherent transport of entangled</text>
    <text x="128" y="708" font-size="23" font-weight="600" fill="#f0ede6">atom arrays</text>
    <text x="128" y="748" font-size="17" font-weight="600" letter-spacing="1.8" fill="#a9a69e">AUTHORS</text>
    <text x="128" y="779" font-size="23" fill="#f0ede6">Bluvstein et al.</text>
    <text x="128" y="820" font-size="17" font-weight="600" letter-spacing="1.8" fill="#a9a69e">JOURNAL / YEAR</text>
    <text x="128" y="851" font-size="23" fill="#f0ede6">Nature · 2022</text>
    <rect x="126" y="875" width="398" height="45" rx="9" fill="#332d22"/>
    <text x="325" y="904" text-anchor="middle" font-size="21" font-weight="500" fill="#e8b451">Metadata filled automatically</text>

    <!-- One search can be narrowed by folder and cross-cutting label. -->
    <rect x="600" y="428" width="560" height="520" rx="20" fill="#272725" stroke="#45443f" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="626" y="455" width="508" height="54" rx="10" fill="#272725" stroke="#555248" stroke-width="1.5"/>
    <use href="#search" x="642" y="469" color="#e8b451"/>
    <text x="684" y="489" font-size="24" fill="#f0ede6">coherent transport</text>
    <path d="M915 469 V494" stroke="#e8b451" stroke-width="2"/>
    <rect x="1033" y="467" width="86" height="30" rx="6" fill="#32312e"/>
    <text x="1076" y="488" text-anchor="middle" font-size="16" fill="#a9a69e">Ctrl F</text>
    <rect x="627" y="525" width="292" height="36" rx="18" fill="#493b23"/>
    <use href="#folder" transform="translate(641 533) scale(0.72)" color="#e8b451"/>
    <text x="674" y="550" font-size="20" fill="#f1cf88">qc / neutral-atom</text>
    <rect x="930" y="525" width="203" height="36" rx="18" fill="#253e32"/>
    <text x="948" y="550" font-size="20" fill="#6fc89f"># quantum-optics</text>
    <path d="M600 582 H1160 M795 582 V876" stroke="#45443f"/>
    <text x="627" y="621" font-size="17" font-weight="600" letter-spacing="1.6" fill="#a9a69e">FOLDERS</text>
    <use href="#folder" transform="translate(626 648) scale(0.8)" color="#e8b451"/>
    <text x="663" y="668" font-size="23" fill="#f0ede6">qc</text>
    <path d="M638 683 V766 M638 704 H652 M638 754 H652" fill="none" stroke="#555248" stroke-width="2"/>
    <rect x="654" y="683" width="129" height="37" rx="7" fill="#493b23"/>
    <text x="663" y="708" font-size="18" fill="#f1cf88">neutral-atom</text>
    <text x="661" y="760" font-size="18" fill="#a9a69e">cavity-QED</text>
    <use href="#folder" transform="translate(626 793) scale(0.8)" color="#a9a69e"/>
    <text x="663" y="813" font-size="21" fill="#a9a69e">to-read</text>
    <text x="819" y="621" font-size="17" font-weight="600" letter-spacing="1.6" fill="#a9a69e">SEARCH RESULTS</text>
    <rect x="814" y="640" width="319" height="206" rx="10" fill="#332d22" stroke="#493b23"/>
    <use href="#page" transform="translate(830 657) scale(0.8)" color="#e8b451"/>
    <text x="866" y="677" font-size="21" font-weight="600" fill="#f0ede6">Atom arrays</text>
    <text x="831" y="716" font-size="20" fill="#a9a69e">“…based on</text>
    <rect x="829" y="727" width="267" height="31" rx="4" fill="#5a4524"/>
    <text x="834" y="750" font-size="22" fill="#f1cf88">coherent transport…”</text>
    <rect x="831" y="785" width="142" height="32" rx="16" fill="#253e32"/>
    <text x="902" y="807" text-anchor="middle" font-size="17" fill="#6fc89f">quantum-optics</text>
    <path d="M626 875 H1134" stroke="#45443f"/>
    <text x="880" y="912" text-anchor="middle" font-size="21" fill="#a9a69e">Search titles, notes and full PDF text</text>

    <!-- References take the reader forward; Back restores the previous place. -->
    <rect x="1210" y="428" width="610" height="520" rx="20" fill="#32312e" stroke="#45443f" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="1240" y="455" width="418" height="209" rx="12" fill="#272725" stroke="#555248" stroke-width="1.5"/>
    <text x="1265" y="490" font-size="17" font-weight="600" letter-spacing="1.5" fill="#a9a69e">READING NOW</text>
    <text x="1265" y="529" font-size="26" font-weight="600" fill="#f0ede6">Coherent atom transport</text>
    <path d="M1265 550 H1633" stroke="#45443f"/>
    <text x="1265" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#a9a69e">A path toward fault-tolerant</text>
    <text x="1265" y="619" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#a9a69e">quantum computation</text>
    <rect x="1510" y="595" width="65" height="34" rx="6" fill="#493b23"/>
    <text x="1542" y="620" text-anchor="middle" font-size="22" font-weight="600" fill="#e8b451">[12]</text>
    <path d="M1586 613 H1718 Q1752 613 1752 647 V693" fill="none" stroke="#e8b451" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1730" y="650" text-anchor="end" font-size="18" fill="#e8b451">Follow</text>
    <text x="1730" y="676" text-anchor="end" font-size="18" fill="#e8b451">reference</text>
    <rect x="1350" y="706" width="440" height="141" rx="12" fill="#272725" stroke="#555248" stroke-width="1.5"/>
    <use href="#page" transform="translate(1374 727) scale(0.75)" color="#e8b451"/>
    <text x="1407" y="748" font-size="17" font-weight="600" letter-spacing="1.3" fill="#a9a69e">LINKED PAPER</text>
    <text x="1374" y="786" font-size="26" font-weight="600" fill="#f0ede6">Quantum error correction</text>
    <path d="M1374 810 H1734 M1374 823 H1626" fill="none" stroke="#555248" stroke-width="5" stroke-linecap="round"/>
    <path d="M1340 787 H1294 Q1266 787 1266 757 V679" fill="none" stroke="#e8b451" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <rect x="1240" y="873" width="164" height="45" rx="10" fill="#493b23"/>
    <path d="M1270 896 H1255 M1262 889 1255 896 1262 903" fill="none" stroke="#f1cf88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1328" y="904" text-anchor="middle" font-size="23" font-weight="600" fill="#f1cf88">Back</text>
    <text x="1423" y="903" font-size="21" fill="#a9a69e">Right where you left off.</text>

    <text x="960" y="1013" text-anchor="middle" font-size="25" fill="#a9a69e">A library you can find your way around. A reading trail you can retrace.</text>
  </g>
</svg>
