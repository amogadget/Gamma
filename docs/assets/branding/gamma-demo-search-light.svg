57.5;271.5;285.6;293.4;301.2;180.0;180.0" keyTimes="0.0000;0.0600;0.0776;0.0926;0.1067;0.1228;0.1411;0.1690;0.1797;0.1958;0.2073;0.2200;0.9700;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1.1s" repeatCount="indefinite"/></rect><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.0350;0.3000;1" dur="10s" repeatCount="indefinite"/></g><g><rect x="330" y="212" width="86" height="34" rx="17" fill="#ecdfc4"/><text x="373" y="236" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#5a4a24">qc/</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4600;0.4750;1.0000" dur="10s" repeatCount="indefinite"/></g><g><text x="140" y="280" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.8" fill="#6b6a65">TITLES</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2400;0.2550;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="140" y="296" width="640" height="50" rx="10" fill="#f6f4ef"/><text x="158" y="327" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a18">A quantum processor based on coherent transport…</text><rect x="647" y="308" width="111" height="26" rx="13" fill="#ffe28f" opacity="0.8"/><text x="702.5" y="326" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5a4a24">3,000-qubit</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2500;0.2650;1.0000" dur="10s" repeatCount="indefinite"/></g><g><text x="140" y="372" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.8" fill="#6b6a65">THIS PAPER · NOTES</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2400;0.2550;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="140" y="388" width="640" height="50" rx="10" fill="#f6f4ef"/><text x="158" y="419" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a18">“…the 3,000-qubit array holds its coherence…”</text><rect x="647" y="400" width="111" height="26" rx="13" fill="#ffe28f" opacity="0.8"/><text x="702.5" y="418" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5a4a24">3,000-qubit</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2500;0.2650;1.0000" dur="10s" repeatCount="indefinite"/></g><g><text x="140" y="464" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.8" fill="#6b6a65">LIBRARY · PDF TEXT</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2400;0.2550;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="140" y="480" width="640" height="50" rx="10" fill="#f6f4ef"/><text x="158" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a18">Continuous operation of a coherent 3,000-qubit system</text><rect x="710" y="492" width="48" height="26" rx="13" fill="#ffe28f" opacity="0.8"/><text x="734.0" y="510" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5a4a24">p. 2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2500;0.2650;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="140" y="540" width="640" height="50" rx="10" fill="#f6f4ef"/><text x="158" y="571" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a18">…scaling toward 3000 qubits requires…</text><rect x="710" y="552" width="48" height="26" rx="13" fill="#ffe28f" opacity="0.8"/><text x="734.0" y="570" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5a4a24">p. 7</text><animate attributeName="opacity" values="0;0;1;1;0.25;0.25" keyTimes="0.0000;0.2650;0.2850;0.4600;0.4800;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="140" y="600" width="640" height="50" rx="10" fill="#f6f4ef"/><text x="158" y="631" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a18">…arrays of 3,000 atoms in tweezers…</text><rect x="710" y="612" width="48" height="26" rx="13" fill="#ffe28f" opacity="0.8"/><text x="734.0" y="630" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5a4a24">p. 1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2800;0.2950;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="140" y="480" width="640" height="50" rx="10" fill="none" stroke="#e8a020" stroke-width="2.5"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.6200;0.6350;1.0000" dur="10s" repeatCount="indefinite"/></g><g><rect x="860" y="160" width="640" height="780" rx="12" fill="#ffffff" filter="url(#shadow)"/>
