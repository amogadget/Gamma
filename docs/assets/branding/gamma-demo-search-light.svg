<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Search notes, highlights and every PDF at once</title>
  <desc id="desc">Ctrl+F opens the search; “3000 qubit” is typed and results appear grouped as titles, this paper's notes and the full text of every PDF, each match badged; a folder chip “qc/” narrows them; one hit is picked and the paper opens with the match highlighted.</desc>
