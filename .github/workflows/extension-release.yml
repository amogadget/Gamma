name: Release the browser extension

# Tag `extension-v<version>` (matching extension/manifest.json) → a GitHub
# release with gamma-connector-<version>.zip attached. Deliberately not `v*`:
# those tags build the Docker image (docker.yml). The same zip is what goes
# to the Chrome Web Store dashboard (see extension/STORE.md).
on:
  push:
    tags: ["extension-v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        id: meta
        run: |
          version=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "extension-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Zip the extension
        run: |
          cd extension
          zip -r "../gamma-connector-${{ steps.meta.outputs.version }}.zip" . -x "STORE.md" "README.md" "*.DS_Store"
          cd ..
          unzip -l "gamma-connector-${{ steps.meta.outputs.version }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamma-connector-${{ steps.meta.outputs.version }}
          path: gamma-connector-${{ steps.meta.outputs.version }}.zip

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Gamma Connector ${{ steps.meta.outputs.version }}
          files: gamma-connector-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: true
