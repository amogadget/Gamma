# Pull-request check: the fast half of what a merge to main would build,
# so a broken main (which would become a release — desktop.yml releases
# on merge) is caught on the PR instead. Backend tests, frontend build,
# extension zip; about three minutes, no installers. The merge skill waits
# for this before merging. Overview: docs/dev/github_actions.md.

name: check

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Manifest parses and the zip builds; the scripts are ES modules that
      # only run inside Chrome, so there is no useful `node --check` here.
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          cd extension && zip -qr ../gamma-connector-check.zip . -x "STORE.md" "README.md" "*.DS_Store" && unzip -l ../gamma-connector-check.zip | tail -1
