# Pull-request check: the fast half of what a merge to main would build,
# so a broken main (whose merge publishes the Docker image) is caught on
# the PR instead. Backend tests, frontend unit tests
# + build, the browser suite against an isolated backend, extension zip;
# no installers. The account server (cloud/) is checked by cloud.yml and
# the website (sites/) by site.yml instead, so a PR that only touches those
# skips this. The merge skill waits
# for this before merging. Overview: docs/dev/github_actions.md.

name: check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
      - ".claude/skills/update-account-server/**"
      - "docs/dev/cloud_accounts.md"
      - "sites/**"
      - ".github/workflows/site.yml"
      - ".claude/skills/build-site/**"
      - "PRIVACY.md"

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/branding/build.mjs --check
      - run: node --test tools/branding/check.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: backend
        run: python -m pytest tests -q -n auto --dist loadfile
      - name: Native migration integrity and source contracts
        run: |
          python -m unittest discover -s tools -p test_audit_native_migration.py -v
          python ipad/scripts/test_native_workspace_contract.py
          python ipad/scripts/test_coordinate_fixture.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  # The browser suite (frontend/tests/e2e): a real backend from this
  # checkout over a throwaway data dir, Playwright's Chromium driving the
  # built app. On a failure the harness's screenshots + log tails are
  # uploaded as the `e2e-failures` artifact (docs/dev/debugging.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # -dev too: the transfer scenario builds its Zotero fixture from a
          # backend test module (backend/tests/test_zotero_import.py).
          pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium-headless-shell
      - working-directory: frontend
        env:
          GAMMA_E2E_PYTHON: python
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          npm run e2e -- --continue
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e/gamma-e2e-*/failures/
          if-no-files-found: ignore

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Manifest parses and the zip builds; the scripts are ES modules that
      # only run inside Chrome, so there is no useful `node --check` here.
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          cd extension && zip -qr ../gamma-connector-check.zip . -x "STORE.md" "README.md" "*.DS_Store" && unzip -l ../gamma-connector-check.zip | tail -1
