name: Codex plugin package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/gamma/**'
      - 'tools/*codex*'
      - 'frontend/src/settings/codexSetup.js'
      - 'frontend/tests/codexSetup.test.mjs'
      - 'docs/dev/mcp.md'
      - 'PRIVACY.md'
      - '.github/workflows/codex-plugin.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*codex*.py'
      - run: node --test frontend/tests/codexSetup.test.mjs
      - run: python tools/release_codex_plugin.py --output dist/codex-plugin --version 0.0.0-preview
      - uses: actions/upload-artifact@v4
        with:
          name: gamma-codex-marketplace-${{ matrix.os }}
          path: |
            dist/codex-plugin/*.zip
            dist/codex-plugin/*.ps1
            dist/codex-plugin/*.sh
            dist/codex-plugin/*SHA256SUMS.txt
          if-no-files-found: error
