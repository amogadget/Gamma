# The Gamma Cloud account server (cloud/) — its own check and its own image,
# independent of the Gamma app's check.yml / docker.yml:
#
# - a pull request touching cloud/ runs the account server's tests only;
# - a manual dispatch from ANY branch (the `update-account-server` skill:
#   `gh workflow run cloud.yml --ref dev`) runs the tests, then publishes
#   ghcr.io/<owner>/gamma-cloud:latest and :sha-<short>. No merge to main is
#   needed to deploy the account server.
#
# Overview: docs/dev/github_actions.md; the service: docs/dev/cloud_accounts.md.
name: cloud

on:
  pull_request:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  workflow_dispatch:

concurrency:
  group: cloud-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gamma-cloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements*.txt
      - working-directory: cloud
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: cloud
        run: python -m pytest tests -q

  # One small image, amd64 only: it runs on one box behind Cloudflare.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud
      - run: echo "::notice::Published ${{ env.IMAGE_NAME }}:latest from ${{ github.ref_name }} @ ${{ github.sha }}"
