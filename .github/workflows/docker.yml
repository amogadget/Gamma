# Server image only. Runs on every push to main (`latest`) — the only
# workflow a merge triggers; desktop.yml and extension.yml are dispatched by
# the `release` skill. The desktop
# release (desktop.yml) dispatches this workflow on its new `v<version>` tag
# with the version as input, which adds the `<version>` and `<major.minor>`
# image tags — a `push: tags` trigger would not do it, since tags created
# with GITHUB_TOKEN never trigger workflows. Overview: docs/dev/github_actions.md.
name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Also tag the image <version> and <major.minor> (set by the desktop release)"
        required: false
        default: ""

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gamma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
