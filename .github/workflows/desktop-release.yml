name: Build the desktop app

# Tag `desktop-v<version>` (matching desktop/package.json) → a GitHub release
# with an Apple Silicon .dmg, Linux AppImages (x86-64 and arm64) and a Windows
# installer attached. Deliberately
# not `v*`: those tags build the Docker image (docker.yml), and not
# `extension-v*` either (extension-release.yml).
#
# Every job builds the artifact and then *runs* it: the same Playwright suite
# that runs locally against the source tree is pointed at the packaged binary
# (GAMMA_PACKAGED_APP), so a release that cannot start its own backend fails
# here rather than on someone's laptop.
on:
  push:
    # desktop-v* is a release. desktop-ci-* builds and tests exactly the same
    # way but publishes nothing — for iterating on a failure that only happens
    # on a runner, without minting versions.
    tags: ["desktop-v*", "desktop-ci-*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the artifacts to a draft release"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        # Git Bash on the Windows runner: `windows-latest` would otherwise use
        # PowerShell, and every script under desktop/scripts is bash.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. A universal build doubles the interpreter, the
          # native wheels and the Electron framework — ~600 MB — and cannot be
          # staged on one runner, because `pip` installs for the host. Intel
          # Macs are not a target.
          - os: macos-14
            label: macOS (Apple Silicon)
            arch: arm64
            artifacts: dist/*.dmg
          - os: ubuntu-latest
            label: Linux (x86-64)
            arch: x64
            artifacts: dist/*.AppImage
          # GitHub's arm64 Linux runners are free for public repositories, and
          # this is the architecture the dev box builds and tests natively, so
          # it is the cheapest platform to add.
          - os: ubuntu-24.04-arm
            label: Linux (arm64)
            arch: arm64
            artifacts: dist/*.AppImage
          - os: windows-latest
            label: Windows (x86-64)
            arch: x64
            artifacts: dist/*.exe
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        id: meta
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == desktop-v* && "$GITHUB_REF_NAME" != "desktop-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the frontend
        run: desktop/scripts/ci-step.sh "frontend build" "cd frontend && npm ci && npm run build"

      - name: Install the shell's dependencies
        run: desktop/scripts/ci-step.sh "npm ci" "cd desktop && npm ci"

      - name: Lint the shell
        run: desktop/scripts/ci-step.sh "lint" "cd desktop && npm run lint"

      - name: Shell unit tests
        run: desktop/scripts/ci-step.sh "unit tests" "cd desktop && npm run test:unit"

      - name: Cache the interpreter download
        uses: actions/cache@v4
        with:
          path: ~/.cache/gamma-desktop
          key: cpython-${{ runner.os }}-${{ matrix.arch }}

      # Downloads a standalone CPython and installs the backend's dependencies
      # into it with that interpreter, so the wheels match the runner's OS and
      # architecture. This is why the Mac builds cannot be made on Linux.
      - name: Stage the Python runtime
        run: desktop/scripts/ci-step.sh "stage" "cd desktop && npm run stage -- --arch ${{ matrix.arch }}"

      - name: Package
        run: desktop/scripts/ci-step.sh "package" "cd desktop && npx electron-builder --publish never --${{ matrix.arch }}"
        env:
          # No Developer ID yet, so electron-builder must not go looking for
          # one and fail the build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # electron-builder's output directory depends on platform and arch
      # (dist/mac-arm64, dist/linux-unpacked, dist/linux-arm64-unpacked, …).
      # Locate the binary rather than hardcoding a path — but check the
      # architecture, because `find | head -1` once handed the x86-64 job an
      # arm64 binary and every test failed in five milliseconds with "process
      # failed to launch".
      - name: Locate the built app
        working-directory: desktop
        run: |
          case "${{ matrix.arch }}" in
            x64)   want="x86.64|x86_64" ;;
            arm64) want="aarch64|arm64" ;;
            *)     echo "unhandled arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Only ever x86-64, one output directory, and Git Bash has no
            # dependable file(1) — so name and existence are the whole check.
            found=$(find dist -maxdepth 2 -name "Gamma.exe" -type f | head -1)
            [ -n "$found" ] || { echo "no Gamma.exe under dist/"; ls -R dist | head -50; exit 1; }
            echo "GAMMA_PACKAGED_APP=$found" >> "$GITHUB_ENV"
            ls -l "$found"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            found=""
            for bundle in $(find dist -maxdepth 2 -name "Gamma.app" -type d); do
              if file "$bundle/Contents/MacOS/Gamma" | grep -qE "$want"; then
                found="$bundle"; break
              fi
            done
            [ -n "$found" ] || { echo "no ${{ matrix.arch }} Gamma.app under dist/"; ls -R dist | head -50; exit 1; }
            echo "GAMMA_BUNDLE=desktop/$found" >> "$GITHUB_ENV"
            echo "GAMMA_PACKAGED_APP=$found/Contents/MacOS/Gamma" >> "$GITHUB_ENV"
            file "$found/Contents/MacOS/Gamma"
          else
            found=""
            for exe in $(find dist -maxdepth 2 -name "gamma-desktop" -type f); do
              if file "$exe" | grep -qE "$want"; then found="$exe"; break; fi
            done
            [ -n "$found" ] || { echo "no ${{ matrix.arch }} gamma-desktop under dist/"; ls -R dist | head -50; exit 1; }
            echo "GAMMA_PACKAGED_APP=$found" >> "$GITHUB_ENV"
            file "$found"
          fi


      # Electron needs a display and a pile of shared libraries. Verified on a
      # bare ubuntu:24.04 container: without this the binary cannot even load
      # (19 unresolved sonames), and `playwright install-deps` covers all of
      # them except GTK — its Chromium is headless-shell, which does not need
      # it, and Electron does.
      - name: Install Electron's runtime dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          scripts/ci-step.sh "electron deps" '
            sudo apt-get update
            sudo apt-get install -y xvfb
            node node_modules/playwright/cli.js install-deps chromium
            sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0
            ldd "$GAMMA_PACKAGED_APP" | grep "not found" && exit 1 || echo "all libraries resolve"
          '

      # The real test: launch the artifact, choose "Run locally", let it start
      # its own bundled interpreter, render a PDF, and quit without orphaning
      # the backend.
      - name: Run the packaged app's tests
        working-directory: desktop
        run: scripts/run-packaged-tests.sh

      # 0.1.0 shipped a dmg containing an unsigned bundle while the tests ran
      # against a signed copy in dist/, so "tests passed" and "the download
      # works" came apart. Open the artifact and run the suite on its payload.
      - name: Test the app inside the artifact (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          echo "verifying $dmg"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          staged=$(mktemp -d)
          cp -R "$mount/Gamma.app" "$staged/"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$staged/Gamma.app"
          # Informational: an ad-hoc signature is not a Developer ID, so
          # Gatekeeper still asks the user once. It must not be "damaged".
          spctl --assess --type execute --verbose=4 "$staged/Gamma.app" || true
          GAMMA_PACKAGED_APP="$staged/Gamma.app/Contents/MacOS/Gamma" \
            scripts/run-packaged-tests.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamma-desktop-${{ steps.meta.outputs.version }}-${{ runner.os }}-${{ matrix.arch }}
          path: desktop/${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Gamma Desktop ${{ steps.meta.outputs.version }}
          files: desktop/${{ matrix.artifacts }}
          draft: true
          generate_release_notes: true
          body: |
            Gamma Desktop ${{ steps.meta.outputs.version }} — double-click to run
            Gamma on your own machine, or point it at a server you already run.

            These builds are **not signed with an Apple Developer ID**, so the
            first launch needs one extra step: right-click Gamma.app → Open, and
            confirm. (Or `xattr -dr com.apple.quarantine /Applications/Gamma.app`.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
