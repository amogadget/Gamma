# The Gamma Cloud account server in production (cloud/deploy/README.md).
#
#   account  the server: ghcr.io/tim4431/gamma-cloud (docker.yml publishes
#            it on every merge to main), its data directory on ./data — that
#            directory IS the secret (signing keys, token hashes): back it up
#            encrypted, never share it.
#   caddy    TLS on the host's own 80/443 with a Let's Encrypt certificate,
#            for a host with a public address (a VPS). The DNS record for the
#            hostname in .env (CADDY_HOST) must point at the host.
#   backup   a daily snapshot of cloud.db into ./data/backups (14 kept) —
#            copy that folder off the machine (rclone to R2, restic, …).
#
# Variants layered with -f: compose.tunnel.yml replaces caddy with a
# Cloudflare Tunnel (no open port; a NAS); compose.build.yml builds the
# image from a copy of the source in ./src instead of pulling it.

services:
  account:
    image: ghcr.io/tim4431/gamma-cloud:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9002:9002"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_HOST: ${CADDY_HOST:-account.gammapdf.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - account

  backup:
    image: ghcr.io/tim4431/gamma-cloud:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python manage.py backup && python - <<'PY'
        import os, pathlib
        keep = 14
        files = sorted(pathlib.Path(os.environ.get("GAMMA_CLOUD_DATA_DIR", "/data"), "backups").glob("*-manual.db"))
        for old in files[:-keep]:
            old.unlink()
        PY
          sleep 86400
        done

volumes:
  caddy-data:
  caddy-config:
