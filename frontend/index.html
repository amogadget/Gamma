<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No browser zoom: the app has its own pinch-zoom on the PDF, and a
         zoomed-in page puts the toolbars out of reach. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.svg" />
    <title>Gamma — Annotate PDFs, Share Your Thinking</title>
    <link rel="preload" href="/pdf.worker.min.mjs" as="worker" crossorigin="anonymous">
    <!-- A pinned theme (Settings → General) must win before the bundle loads,
         or the splash flashes the OS color. App.jsx keeps the attribute in
         sync (and handles "system") once React is up. -->
    <script>
      try {
        var t = localStorage.getItem("gamma-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #111; }
      html { color-scheme: dark; }
      @media (prefers-color-scheme: light) {
        html, body, #root { background: #f6f6f4; }
        html { color-scheme: light; }
      }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background: #f6f6f4; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #111; }
      html[data-theme="dark"] { color-scheme: dark; }
      /* First-load splash: index.html is tiny and paints immediately, while
         the app bundle (~450 kB gzipped) downloads and parses — without this
         that window is a pure blank page. Lives inside #root, so React's
         first render commit replaces it automatically. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #8a8a8a;
        font: 13px system-ui, -apple-system, sans-serif;
      }
      #splash .spin {
        width: 22px;
        height: 22px;
        border: 2.5px solid rgba(138, 138, 138, 0.25);
        border-top-color: #8a8a8a;
        border-radius: 50%;
        animation: splashSpin 0.9s linear infinite;
      }
      @keyframes splashSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="spin"></div>
        <div>Loading Gamma…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
