<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Save to Gamma</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- no server configured -->
  <div id="view-setup" class="hidden">
    <div class="head"><span class="dot bad"></span><div><div class="t">Connect to your Gamma server</div><div class="s">Enter the address you open Gamma at, e.g. <code>http://gamma.local:9001</code>.</div></div></div>
    <div class="form">
      <div class="row stack"><label for="setup-server">Server URL</label><input id="setup-server" type="url" placeholder="http://host:9001" autocomplete="url"></div>
    </div>
    <div id="setup-msg" class="msg err hidden"></div>
    <div class="actions"><button id="setup-connect" class="btn primary">Connect</button></div>
  </div>

  <!-- not signed in -->
  <div id="view-login" class="hidden">
    <div class="head"><span class="dot bad"></span><div><div class="t">Sign in to Gamma</div><div class="s" id="login-server"></div></div></div>
    <form id="login-form" class="form">
      <div class="row"><label for="login-user">User</label><input id="login-user" type="text" autocomplete="username" required></div>
      <div class="row"><label for="login-pass">Password</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
    </form>
    <div id="login-msg" class="msg err hidden"></div>
    <div class="actions"><button id="login-btn" class="btn primary">Sign in</button></div>
    <div class="foot"><span id="login-foot"></span><button class="gear" id="gear-login" title="Options">⚙</button></div>
  </div>

  <!-- the main popup -->
  <div id="view-main" class="hidden">
    <div class="head"><span id="dot" class="dot"></span><div><div class="t" id="title"></div><div class="s" id="sub"></div></div></div>

    <div id="found" class="hidden">
      <div class="form">
        <div class="row"><label for="folder">Folder</label>
          <select id="folder"></select></div>
        <div class="row hidden" id="folder-new-row"><span class="lbl"></span><input id="folder-new" type="text" placeholder="new folder, e.g. reading/2026"></div>
        <div class="row"><label for="labels">Labels</label><input id="labels" type="text" list="label-list" placeholder="comma-separated"><datalist id="label-list"></datalist></div>
      </div>
      <div class="actions"><button id="save" class="btn primary">Save to Gamma</button></div>
    </div>

    <div id="existing" class="hidden">
      <div class="msg ok">Already in your library.</div>
      <div class="actions">
        <button id="open-existing" class="btn primary">Open in Gamma</button>
        <button id="refile" class="btn link">Add to another folder…</button>
      </div>
    </div>

    <div id="nothing" class="hidden">
      <div class="msg info">No paper or PDF detected on this page. You can still save the page's URL — Gamma will look for a PDF behind it.</div>
      <div class="actions"><button id="save-anyway" class="btn">Save this URL anyway</button></div>
    </div>

    <div id="clip-row" class="actions hidden" style="padding-top:0">
      <button id="clip" class="btn">Clip selected text to Gamma</button>
    </div>

    <div id="progress" class="progress hidden"><span class="spinner"></span><span id="progress-text"></span></div>
    <div id="result" class="msg hidden"></div>

    <div class="foot"><span id="foot"></span><button class="gear" id="gear" title="Options">⚙</button></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
