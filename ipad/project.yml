name: GammaIPad
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    # Swift language mode; Xcode 15 supplies the Swift 5.9 compiler.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GammaIPad:
    type: application
    platform: iOS
    sources:
      - path: GammaIPad
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamma.pdfnotes.ipad
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Gamma
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio notes linked to your Gamma document when you tap Record.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to attach to a Gamma note when you choose Camera.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select images to attach to Gamma notes when you choose them.
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: PDFKit.framework
      - sdk: PencilKit.framework
      - sdk: UniformTypeIdentifiers.framework
  GammaIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GammaIPadTests
    dependencies:
      - target: GammaIPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamma.pdfnotes.ipad.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GammaIPad:
    build:
      targets:
        GammaIPad: all
        GammaIPadTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - GammaIPadTests
