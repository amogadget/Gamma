<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a Gamma paper</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; color: var(--color-text-primary, light-dark(#202124, #eee)); background: var(--color-background-primary, light-dark(#fff, #202124)); }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { padding: 16px; }
  header { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  header img { width: 32px; height: 32px; }
  header p { margin: 0; }
  h1 { font-size: 19px; margin: 0; }
  p { margin: 4px 0 14px; }
  .muted { color: var(--color-text-secondary, light-dark(#646973, #b6bac1)); font-size: 13px; }
  #search, footer, .actions { display: flex; gap: 8px; align-items: center; }
  input, button, textarea { font: inherit; border: 1px solid var(--color-border-primary, light-dark(#ddd, #555)); border-radius: 8px; padding: 9px 12px; background: var(--color-background-primary, light-dark(#fff, #202124)); color: inherit; }
  input { min-width: 0; flex: 1; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #4285ef; outline-offset: 2px; }
  #status { min-height: 20px; margin: 10px 0; }
  #results { display: grid; gap: 8px; max-height: 340px; overflow-y: auto; padding: 2px; }
  .paper { width: 100%; text-align: left; padding: 12px; overflow-wrap: anywhere; }
  .paper[aria-pressed="true"] { border-color: #4285ef; background: light-dark(#eff5ff, #26354b); }
  .paper strong, .paper small { display: block; }
  .paper small { margin-top: 4px; }
  footer { flex-wrap: wrap; justify-content: space-between; margin-top: 16px; }
  #use { background: #2867d7; color: #fff; border-color: #2867d7; }
  #question { width: 100%; margin-top: 12px; }
  #confirmation { padding-top: 12px; }
  #fallback { margin-top: 14px; }
  textarea { width: 100%; resize: vertical; }
  [hidden] { display: none !important; }
  @media (max-width: 420px) { main { padding: 12px; } footer { align-items: stretch; } #use { width: 100%; } }
</style>
</head>
<body>
<main>
<header><img src="__GAMMA_ICON__" alt="Gamma"><div><h1>Choose a paper</h1>
<p id="workspace" class="muted">Your connected Gamma workspace · Read-only</p></div></header>
<div id="chooser">
<div id="search" role="search"><input id="query" type="search" aria-label="Search papers by title" placeholder="Search papers by title…" maxlength="200" disabled><button id="searchButton" type="button" disabled>Search</button></div>
<p id="status" class="muted" role="status">Connecting to your assistant…</p>
<div id="results" role="group" aria-label="Papers"></div>
<input id="question" aria-label="Question about the selected paper" placeholder="Ask about this paper (optional)" maxlength="4000" disabled>
<footer><div id="pagination" class="actions" hidden><button id="previous" disabled>Previous</button><button id="next" disabled>Next</button></div><button id="use" disabled>Use this paper</button></footer>
<div id="fallback" hidden><p class="muted">You can also copy this reference into the chat:</p><textarea id="reference" aria-label="Selected paper reference" rows="2" readonly></textarea></div>
</div>
<div id="confirmation" hidden><p id="added" role="status"></p><button id="change" type="button">Choose another paper</button></div>
</main>
<script>
(() => {
  const el = (id) => document.getElementById(id);
  const pending = new Map();
  let sequence = 0, ready = false, busy = false, data = null, selected = null, hostOrigin = null, revision = 0;
  function post(message) { window.parent.postMessage({ jsonrpc: "2.0", ...message }, hostOrigin || "*"); }
  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++sequence;
      const timer = setTimeout(() => { pending.delete(id); reject(new Error("Your assistant did not respond. Try again.")); }, 15000);
      pending.set(id, { resolve, reject, timer });
      post({ id, method, params });
    });
  }
  function controls() {
    el("query").disabled = !ready || busy;
    el("searchButton").disabled = !ready || busy;
    el("previous").disabled = !ready || busy || !data || data.offset === 0;
    el("next").disabled = !ready || busy || !data || data.next_offset == null;
    el("use").disabled = !ready || busy || !selected;
    el("question").disabled = !ready || busy || !selected;
    el("use").textContent = el("question").value.trim() ? "Ask about this paper" : "Use this paper";
    el("results").querySelectorAll("button").forEach((button) => { button.disabled = busy; });
  }
  function render(result) {
    if (result?.isError) throw new Error(result.content?.find((c) => c.type === "text")?.text || "Could not load papers.");
    const value = result?.structuredContent;
    if (!value || !Array.isArray(value.pages) || !value.workspace) throw new Error("No paper list was returned. Try searching again.");
    data = value; selected = null;
    el("fallback").hidden = true;
    el("query").value = data.query;
    el("workspace").textContent = `${data.workspace.name} · Read-only`;
    el("results").replaceChildren();
    el("pagination").hidden = data.offset === 0 && data.next_offset == null;
    const titleCounts = new Map();
    data.pages.forEach((paper) => titleCounts.set(paper.title, (titleCounts.get(paper.title) || 0) + 1));
    data.pages.forEach((paper) => {
      const button = document.createElement("button");
      button.className = "paper"; button.type = "button"; button.setAttribute("aria-pressed", "false");
      const title = document.createElement("strong"); title.textContent = paper.title;
      const detail = document.createElement("small"); detail.className = "muted";
      // Only duplicate titles need an ID to tell them apart.
      detail.textContent = titleCounts.get(paper.title) > 1 ? `${paper.kind} · ${paper.id}` : paper.kind;
      button.append(title, detail);
      button.onclick = () => {
        selected = paper;
        el("results").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
        el("fallback").hidden = true;
        el("status").textContent = `Selected: ${paper.title}`;
        controls();
      };
      el("results").append(button);
    });
    el("status").textContent = data.pages.length
      ? `${data.offset + 1}–${data.offset + data.pages.length} of ${data.total} papers and notes`
      : data.query ? "No matching titles. Try fewer words." : "This workspace has no papers or notes yet.";
    controls();
  }
  function theme(context) {
    if (context?.theme === "dark" || context?.theme === "light") document.documentElement.style.colorScheme = context.theme;
  }
  window.addEventListener("message", (event) => {
    // Only accept the embedding host, never sibling frames or document content.
    if (event.source !== window.parent || (hostOrigin && event.origin !== hostOrigin)) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    const call = pending.get(message.id);
    if (call && ("result" in message || "error" in message)) {
      // Opaque sandbox origins require '*', but are still checked by source.
      if (event.origin !== "null") hostOrigin = event.origin;
      clearTimeout(call.timer); pending.delete(message.id);
      if (message.error) call.reject(new Error(message.error.message || "Your assistant declined the request."));
      else call.resolve(message.result);
    } else if (message.method === "ui/notifications/tool-result" && !busy && revision === 0) {
      try { render(message.params); } catch { el("status").textContent = "Could not load papers. Try searching again."; }
    } else if (message.method === "ui/notifications/host-context-changed") theme(message.params);
    else if (message.method === "ui/notifications/tool-cancelled") el("status").textContent = "Paper search cancelled. Try searching again.";
    else if (message.method === "ui/resource-teardown" || message.method === "ping") post({ id: message.id, result: {} });
  });
  async function search(offset) {
    if (!ready || busy) return;
    revision++; busy = true; selected = null; controls();
    el("fallback").hidden = true;
    el("status").textContent = "Searching your workspace…";
    try {
      render(await request("tools/call", { name: "search_paper_choices", arguments: { query: el("query").value.trim(), offset } }));
    } catch {
      data = null; el("results").replaceChildren(); el("pagination").hidden = true;
      el("status").textContent = "Could not search Gamma. Check your connection and try again.";
    } finally { busy = false; controls(); }
  }
  el("searchButton").onclick = () => search(0);
  el("query").onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); search(0); } };
  el("previous").onclick = () => search(Math.max(0, data.offset - 20));
  el("next").onclick = () => search(data.next_offset);
  el("question").oninput = controls;
  el("question").onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); el("use").click(); } };
  el("change").onclick = () => {
    render({ structuredContent: data });
    el("chooser").hidden = false; el("confirmation").hidden = true; el("query").focus();
  };
  el("use").onclick = async () => {
    if (!selected || busy) return;
    const paper = selected;
    // The URL carries exact page/workspace IDs; keep the visible message readable.
    const question = el("question").value.trim();
    const text = `Use this Gamma page: ${JSON.stringify(paper.title)}\n${paper.url}`
      + (question ? `\n\n${question}` : "");
    busy = true; controls(); el("status").textContent = "Adding paper to the conversation…";
    try {
      const result = await request("ui/message", { role: "user", content: [{ type: "text", text }] });
      if (result?.isError) throw new Error("Message declined");
      el("fallback").hidden = true;
      el("status").textContent = `Added: ${paper.title}. Ask your question in chat.`;
      el("added").textContent = question ? `Sent your question about ${paper.title}.` : `${paper.title} is ready to discuss. Ask your question in chat.`;
      el("chooser").hidden = true; el("confirmation").hidden = false;
      el("question").value = "";
    } catch {
      el("status").textContent = "Could not add the paper to chat. Try again, or copy the reference below.";
      el("reference").value = text; el("fallback").hidden = false;
    } finally { busy = false; controls(); }
  };
  el("reference").onfocus = (event) => event.target.select();
  if (window.parent === window) {
    el("status").textContent = "Open this picker from your assistant using Gamma's show_paper_picker tool.";
    return;
  }
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "Gamma paper picker", version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] } }).then((result) => {
    if (result.protocolVersion !== "2026-01-26") throw new Error("This assistant uses an unsupported picker version. Ask it to list Gamma papers instead.");
    theme(result.hostContext); ready = true;
    post({ method: "ui/notifications/initialized", params: {} }); controls();
    if (!data) el("status").textContent = "Loading papers…";
    new ResizeObserver(() => post({ method: "ui/notifications/size-changed", params: { height: document.body.scrollHeight, width: document.documentElement.clientWidth } })).observe(document.body);
  }).catch((error) => { el("status").textContent = error.message; });
})();
</script>
</body>
</html>
